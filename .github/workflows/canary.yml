name: Canary — raceresult-Vertrag

# Die Einbettung des fremden Anmeldeformulars ist mit dem Zeitnehmer
# abgestimmt, das Betriebsrisiko liegt aber bei uns: raceresult ändert sein
# Produkt ohne Ankündigung. Dieser Job ist die Antwort darauf.

on:
  schedule:
    - cron: '0 5 * * *' # 07:00 Berliner Zeit (06:00 im Winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/content/**'
      - 'src/scripts/widget.ts'
      - 'src/styles/widget.css'
      - 'tests/contract/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      layer: ${{ steps.run.outputs.layer }}
      stand: ${{ steps.run.outputs.stand }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Vertragstests
        id: run
        run: |
          set +e
          npm run test:contract 2>&1 | tee canary.log
          code=${PIPESTATUS[0]}
          set -e

          # Der beobachtete Stand bei raceresult. Loader- und Build-Version
          # stehen bewusst nicht mehr in der Baseline — sie zählen mehrmals pro
          # Woche hoch, ohne dass sich am Inhalt etwas ändert (siehe
          # tests/contract/product.test.ts). Sichtbar bleiben sollen sie
          # trotzdem, also wandern sie in den Kopf des Issues statt in einen
          # täglichen Fehlalarm.
          echo "stand=$(grep -m1 'raceresult-Stand:' canary.log || true)" >> "$GITHUB_OUTPUT"

          if [ "$code" -eq 0 ]; then
            exit 0
          fi

          # Jede Ursache bekommt ihr eigenes Label — ein Ausfall bei raceresult
          # soll nicht wie eine Änderung an unserer Integration aussehen.
          #
          # Reihenfolge zählt: RegistrationClosedError ist der Sonderfall
          # „Registrierungsseite antwortet, aber ohne Formular" und ginge sonst
          # als UnreachableError durch. Er erscheint hier überhaupt nur, wenn
          # die Anmeldung VOR dem Meldeschluss zu ist — danach überspringt der
          # Test und der Lauf bleibt grün.
          if grep -q 'RegistrationClosedError' canary.log; then
            echo "layer=closed" >> "$GITHUB_OUTPUT"
          elif grep -q 'UnreachableError' canary.log; then
            echo "layer=unreachable" >> "$GITHUB_OUTPUT"
          elif grep -q 'Produkt-Schicht' canary.log; then
            echo "layer=product" >> "$GITHUB_OUTPUT"
          else
            echo "layer=event" >> "$GITHUB_OUTPUT"
          fi
          exit 1

      - name: Log als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-log
          path: canary.log
          retention-days: 30

  report:
    needs: contract
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: canary-log
        continue-on-error: true

      - name: Issue öffnen, aktualisieren oder schließen
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.contract.result }}
          LAYER: ${{ needs.contract.outputs.layer }}
          STAND: ${{ needs.contract.outputs.stand }}
        with:
          script: |
            const fs = require('fs');
            // Fester Titel = Deduplizierung. Ohne das stünde hier nach einer
            // Woche Ausfall ein Stapel identischer Issues.
            const TITLE = 'Canary: raceresult-Vertrag weicht ab';
            const ok = process.env.RESULT === 'success';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;

            const { data: offen } = await github.rest.issues.listForRepo({
              ...repo, state: 'open', labels: 'canary',
            });
            const bestehend = offen.find((i) => i.title === TITLE);

            if (ok) {
              // Wieder grün: Issue schließen statt es verwaisen zu lassen.
              if (bestehend) {
                await github.rest.issues.createComment({
                  ...repo, issue_number: bestehend.number,
                  body: `Canary ist wieder grün ([Lauf](${runUrl})). Wird automatisch geschlossen.`,
                });
                await github.rest.issues.update({
                  ...repo, issue_number: bestehend.number, state: 'closed',
                });
              }
              return;
            }

            let log = '';
            try { log = fs.readFileSync('canary.log', 'utf8').slice(-6000); } catch {}

            const layer = process.env.LAYER || 'event';
            const erklaerung = {
              product: '**raceresult hat sein Produkt geändert.** Angekündigt wird das nicht. Prüfen, ob `src/styles/widget.css` und `src/scripts/widget.ts` noch greifen.',
              event: '**Der Zeitnehmer hat vermutlich das Event bearbeitet.** Kein Notfall: kurz nachfragen, dann ggf. `src/content/event.yaml` angleichen und `npm run canary:update` laufen lassen.',
              unreachable: '**raceresult war nicht erreichbar.** Das ist kein Vertragsbruch. Wenn das mehrere Tage anhält, beim Zeitnehmer nachfragen.',
              closed: '**Die Anmeldung ist geschlossen, obwohl der Meldeschluss noch nicht erreicht ist.** Wir bewerben sie also gerade ins Leere. Sofort beim Zeitnehmer nachfragen — entweder ist das Feld ausgebucht oder jemand hat die Anmeldung versehentlich abgeschaltet. (Nach dem Meldeschluss ist eine geschlossene Anmeldung normal und erzeugt kein Issue.)',
            }[layer];

            const body = [
              erklaerung, '',
              `Lauf: [${context.runId}](${runUrl})`,
              // Ganz oben, weil das Log unten auf die letzten 6000 Zeichen
              // gekürzt wird und diese Zeile sonst wegfiele.
              process.env.STAND ? `\n${process.env.STAND}` : '', '',
              '<details><summary>Testausgabe</summary>', '',
              '```', log || '(kein Log)', '```', '',
              '</details>',
            ].join('\n');

            const labels = ['canary', `canary:${layer}`];

            if (bestehend) {
              // Aktualisieren statt neu anlegen — ein Issue pro Vorfall.
              await github.rest.issues.createComment({
                ...repo, issue_number: bestehend.number, body,
              });
              await github.rest.issues.setLabels({
                ...repo, issue_number: bestehend.number, labels,
              });
            } else {
              await github.rest.issues.create({ ...repo, title: TITLE, body, labels });
            }
