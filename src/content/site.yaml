  items:
    - name: EFTAS Fernerkundung Technologietransfer GmbH
      role: Hauptsponsor
      logo: /sponsors/eftas/logo_long.png
      # Dieselbe Grafik in 1404x421 — die Quelle, aus der logo_long.png stammt.
      logo_2x: /sponsors/eftas/Webseite_Sponsoren-Fusszeile_1600px_final.png
      width: 634
      height: 125
      url: https://www.eftas.com/
      header: true
    - name: DERMASENCE
      logo: /sponsors/dermasence/logo.svg
      width: 460
      height: 91
