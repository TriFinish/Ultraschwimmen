# Alles, was das Wettkampfjahr überdauert. Was 2027 neu gepflegt werden muss,
# steht nebenan in event.yaml.

site:
  name: Ultraschwimmen
  tagline: Münsters Freiwasserwettkampf
  url: https://ultraschwimmen.de
  logo: /tri-finish/logo.svg

# Reihenfolge hier = Reihenfolge im Menü. Eine Ebene tief, mehr nicht — siehe
# navItemSchema. Interne Ziele mit führendem UND schließendem Schrägstrich.
# Kein Eintrag „Startseite": Dorthin führt das Logo im Kopf, wie überall im
# Web. Ein zusätzlicher Textlink wäre ein zweiter Weg zum selben Ziel.
nav:
  - label: Wettkampf
    children:
      # `mobile: true` = erscheint zusätzlich als Reiter in der Daumenleiste am
      # unteren Rand. Höchstens drei; mehr passt neben „Start" und „Mehr" nicht.
      #
      # `icon` braucht dagegen JEDER Eintrag: Was nicht Reiter ist, landet unter
      # „Mehr", und dort steht seit dem Umbau ebenfalls ein Symbol neben dem
      # Wort. Fehlt es, fällt MobileNav auf einen leeren Kreis zurück — das
      # sieht aus wie ein Fehler und ist auch einer.
      - label: Anmeldung
        href: /anmelden/
        mobile: true
        icon: lucide:clipboard-pen
      - label: Ausschreibung
        href: /ausschreibung/
        icon: lucide:file-text
      - label: Zeitplan
        href: /zeitplan/
        mobile: true
        icon: lucide:clock
      - label: Strecke
        href: /strecke/
        mobile: true
        icon: lucide:waves
      - label: Ergebnisse
        href: /ergebnisse/
        icon: lucide:trophy
  - label: Fotos
    href: /fotos/
    icon: lucide:image
  - label: Kontakt
    href: /kontakt/
    icon: lucide:mail

# Die beiden Wege, auf denen wir erreichbar sind. Facebook stand früher
# daneben, ist aber bewusst nicht mehr dabei: Wer hier schreibt, soll eine
# Antwort bekommen, und gepflegt wird nur Instagram.
contact:
  email: info@ultraschwimmen.de
  instagram:
    handle: "@ultraschwimmen"
    url: https://www.instagram.com/ultraschwimmen/

