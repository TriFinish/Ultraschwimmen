# Alles, was das Wettkampfjahr überdauert. Was 2027 neu gepflegt werden muss,
# steht nebenan in event.yaml.

site:
  name: Ultraschwimmen
  tagline: Münsters Freiwasserwettkampf
  url: https://ultraschwimmen.de
  logo: /tri-finish/logo.svg

# Reihenfolge hier = Reihenfolge im Menü. Eine Ebene tief, mehr nicht — siehe
# navItemSchema. Interne Ziele mit führendem UND schließendem Schrägstrich.
# Kein Eintrag „Startseite": Dorthin führt das Logo im Kopf, wie überall im
# Web. Ein zusätzlicher Textlink wäre ein zweiter Weg zum selben Ziel.
nav:
  - label: Wettkampf
    children:
      # `mobile: true` = erscheint zusätzlich als Reiter in der Daumenleiste am
      # unteren Rand. Höchstens drei; mehr passt neben „Start" und „Mehr" nicht.
      #
      # `icon` braucht dagegen JEDER Eintrag: Was nicht Reiter ist, landet unter
      # „Mehr", und dort steht seit dem Umbau ebenfalls ein Symbol neben dem
      # Wort. Fehlt es, fällt MobileNav auf einen leeren Kreis zurück — das
      # sieht aus wie ein Fehler und ist auch einer.
      - label: Anmeldung
        href: /anmelden/
        mobile: true
        icon: lucide:clipboard-pen
      - label: Ausschreibung
        href: /ausschreibung/
        icon: lucide:file-text
      - label: Zeitplan
        href: /zeitplan/
        mobile: true
        icon: lucide:clock
      - label: Strecke
        href: /strecke/
        mobile: true
        icon: lucide:waves
      - label: Ergebnisse
        href: /ergebnisse/
        icon: lucide:trophy
  - label: Fotos
    href: /fotos/
    icon: lucide:image
  - label: Sponsoren
    href: /sponsoren/
    icon: lucide:handshake
  - label: Kontakt
    href: /kontakt/
    icon: lucide:mail

# Die beiden Wege, auf denen wir erreichbar sind. Facebook stand früher
# daneben, ist aber bewusst nicht mehr dabei: Wer hier schreibt, soll eine
# Antwort bekommen, und gepflegt wird nur Instagram.
contact:
  email: info@ultraschwimmen.de
  instagram:
    handle: "@ultraschwimmen"
    url: https://www.instagram.com/ultraschwimmen/

# Pflichtangaben nach § 5 TMG. Speisen das Impressum, den Footer und die
# strukturierten Daten — deshalb hier und nicht als Prosa in der Seite.
organizer:
  name: Tri Finish Münster e.V.
  legal_name: 1. Triathlonverein Finish Münster e. V.
  address_lines:
    - Bürogemeinschaft 1. Etage
    - Lublinring 12
    - 48147 Münster
  represented_by: Matthias Arnold, Dominik Pabst und Rolf Sudmann
  phone: 0251-39489802
  email: office@trifinish.eu
  register_court: Amtsgericht Münster
  register_number: "2815"
  content_responsible: Rolf Sudmann
  url: https://trifinish.eu

# Erscheinen als Band über dem Fußbereich. Auf der alten Seite war das ein
# einziges, fest zusammengesetztes Bild — mit unlesbarem Text auf dem Handy und
# ohne Links. Einzelne Logos lassen sich verlinken und beschriften.
# Reihenfolge = Reihenfolge im Band unter jeder Seite UND auf /sponsoren/.
# `description` erscheint nur auf der Seite, das Band zeigt weiterhin nur Logo
# und Rolle.
sponsors:
  headline: Unterstützt von
  items:
    - name: EFTAS Fernerkundung Technologietransfer GmbH
      role: Hauptsponsor
      logo: /sponsors/eftas/logo_long.png
      width: 634
      height: 125
      url: https://www.eftas.com/
      header: true
      description: Hauptsponsor des Ultraschwimmens. EFTAS arbeitet mit Fernerkundung und Geodaten — mit Daten von Land und Wasser also, was für einen Wettkampf im Hafenbecken besser passt als den meisten Sponsorings nachgesagt wird.
    - name: DERMASENCE
      role: Sponsor
      logo: /sponsors/dermasence/logo.svg
      # 460x94 laut SVG. Stand vorher auf 91 — das reservierte beim Laden einen
      # etwas zu flachen Kasten, und das Band zuckte, wenn das Logo ankam.
      width: 460
      height: 94
      url: https://www.dermasence.de/
      description: DERMASENCE steht für medizinische Hautpflege und unterstützt das Ultraschwimmen. Nach mehreren Stunden im Freigewässer ist das kein abwegiges Thema — siehe den Hinweis zu Zerkarien in der Ausschreibung.
    - name: Power Sports Münster
      role: Partner vor Ort
      logo: /sponsors/powersports/logo.svg
      width: 198
      height: 62
      description: Stellt uns das Gelände am Hafenkai zur Verfügung. Hier stehen die Zelte, hier ist die Startunterlagenausgabe, und hier gehen alle ins Wasser und wieder heraus. Ohne diese Fläche gäbe es den Wettkampf an dieser Stelle nicht.

footer:
  note: Ultraschwimmen ist eine Veranstaltung des Tri Finish Münster e.V.
  links:
    - label: Impressum
      href: /impressum/
    - label: Datenschutz
      href: /datenschutz/
